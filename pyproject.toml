[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "doc2md"
version = "0.1.0"
description = "CLI tool to convert documents (HTML, DOCX, PDF, TXT) to Markdown"
authors = ["Your Name <email>"]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typer[all]>=0.9.0",
    "html2text>=2020.1.16",
    "python-docx>=0.8.11",
    "mammoth>=1.5.0",
    "pdfplumber>=0.10.0",
    "requests>=2.28.0",
    "click>=8.1.0",   # typer зависит, но явно
]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]  # базовый набор

[tool.black]
line-length = 100